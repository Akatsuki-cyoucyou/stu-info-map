<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>信息检索与路线评估</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#e8f3ff',
              100: '#cce4ff',
              500: '#1677ff',
              600: '#0958d9',
              700: '#003eb3',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Microsoft YaHei"', '"Helvetica Neue"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS (国内 BootCDN 源) -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    /* 自定义滚动条样式，保持界面清爽 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 起点脉冲动画标记 */
    .origin-pulse-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .origin-pulse-ring {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.35);
      animation: originPulse 2s infinite ease-out;
    }
    .origin-dot {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10b981;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }
    @keyframes originPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* 目标点自定义气泡标记 */
    .custom-marker-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #ffffff;
      color: #1e293b;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.14);
      transform: translate(-50%, -100%);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .custom-marker-pill::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 5px 0 5px;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
    }
    .custom-marker-pill.active {
      background: #1677ff;
      color: #ffffff;
      border-color: #0958d9;
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.4);
      transform: translate(-50%, -110%) scale(1.06);
      z-index: 1000 !important;
    }
    .custom-marker-pill.active::after {
      border-color: #1677ff transparent transparent transparent;
    }

    /* 路线折线动态流动效果 */
    .route-polyline-animated {
      stroke-dasharray: 10, 10;
      animation: dashFlow 1s linear infinite;
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }

    /* 选点模式鼠标指针 */
    .cursor-crosshair-map {
      cursor: crosshair !important;
    }

    /* 确保 Leaflet 容器层级不遮挡弹窗 */
    .leaflet-container {
      z-index: 1;
      font-family: inherit;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden select-none sm:select-auto">

  <!-- 全局主容器：移动端上下布局（地图在上，列表在下），桌面端左右分栏（列表在左，地图在右） -->
  <div class="flex flex-col lg:flex-row h-screen w-screen overflow-hidden">

    <!-- ==================== 右侧（移动端上方）：交互式地图区域 ==================== -->
    <main class="order-1 lg:order-2 relative w-full h-[38vh] sm:h-[42vh] lg:h-full lg:flex-1 bg-slate-200 flex-shrink-0">
      <div id="mainMap" class="w-full h-full"></div>

      <!-- 地图顶部悬浮工具栏：起点控制 -->
      <div class="absolute top-3 left-3 right-3 sm:left-auto sm:right-4 z-[400] flex flex-wrap items-center justify-end gap-2 pointer-events-none">
        <!-- 当前起点坐标状态指示 -->
        <div class="pointer-events-auto hidden sm:flex items-center gap-2 bg-white/95 backdrop-blur px-3 py-2 rounded-xl shadow-md border border-slate-200/80 text-xs text-slate-600">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>
          <span>起点：<strong id="originLabel" class="text-slate-800 font-semibold">上海人民广场</strong></span>
        </div>

        <!-- 获取浏览器定位按钮 -->
        <button id="btnLocateMe" type="button"
          class="pointer-events-auto flex items-center gap-1.5 bg-white/95 hover:bg-slate-50 active:scale-95 text-slate-700 px-3 py-2 rounded-xl shadow-md border border-slate-200/80 text-xs font-medium transition">
          <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.364-5.364l-1.414 1.414M8.05 15.95l-1.414 1.414m0-11.314l1.414 1.414m7.9 7.9l1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
          <span>当前定位</span>
        </button>

        <!-- 点击地图重设起点按钮 -->
        <button id="btnPickOrigin" type="button"
          class="pointer-events-auto flex items-center gap-1.5 bg-white/95 hover:bg-slate-50 active:scale-95 text-slate-700 px-3 py-2 rounded-xl shadow-md border border-slate-200/80 text-xs font-medium transition">
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="btnPickOriginText">点图设起点</span>
        </button>
      </div>

      <!-- 重设起点模式提示条 -->
      <div id="pickOriginBanner" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 z-[400] bg-slate-900/90 text-white px-4 py-2.5 rounded-full shadow-lg text-xs sm:text-sm flex items-center gap-3 whitespace-nowrap">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>请在地图上点击任意位置作为新起点</span>
        <button id="btnCancelPickOrigin" type="button" class="text-slate-300 hover:text-white underline ml-1">取消</button>
      </div>
    </main>

    <!-- ==================== 左侧（移动端下方）：检索、筛选与列表区域 ==================== -->
    <aside class="order-2 lg:order-1 w-full lg:w-[460px] xl:w-[500px] h-[62vh] sm:h-[58vh] lg:h-full flex flex-col bg-slate-50 border-t lg:border-t-0 lg:border-r border-slate-200 shadow-sm z-10 overflow-hidden">

      <!-- 顶部标题与录入按钮 -->
      <header class="bg-white px-4 pt-3.5 pb-3 border-b border-slate-200/80 flex-shrink-0">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-sm">
              <svg class="w-4.5 h-4.5 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
              </svg>
            </div>
            <div>
              <h1 class="text-base font-bold text-slate-900 leading-tight">信息检索与路线评估</h1>
              <p class="text-[11px] text-slate-400 leading-tight mt-0.5">多维筛选 · 交通时长估算 · 地图路线联动</p>
            </div>
          </div>

          <button id="btnOpenInput" type="button"
            class="flex items-center gap-1 bg-brand-500 hover:bg-brand-600 active:scale-95 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-sm transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span>录入信息</span>
          </button>
        </div>

        <!-- 搜索框与筛选按钮行 -->
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/>
            </svg>
            <input id="searchInput" type="text" placeholder="检索标题、正文、地址、学科..."
              class="w-full bg-slate-100 hover:bg-slate-200/70 focus:bg-white border border-transparent focus:border-brand-500 rounded-xl pl-9 pr-8 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none transition" />
            <button id="btnClearSearch" type="button" title="清除搜索"
              class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-slate-300/80 hover:bg-slate-400 text-white flex items-center justify-center text-xs transition">
              ✕
            </button>
          </div>

          <button id="btnOpenFilter" type="button"
            class="relative flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition flex-shrink-0">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            <span>筛选</span>
            <span id="filterCountBadge" class="hidden min-w-[18px] h-[18px] px-1 rounded-full bg-brand-500 text-white text-[11px] font-bold flex items-center justify-center">0</span>
          </button>
        </div>

        <!-- 已选筛选条件快捷预览条 -->
        <div id="activeFilterSummary" class="hidden mt-2.5 flex items-center gap-1.5 flex-wrap"></div>
      </header>

      <!-- 结果统计条 -->
      <div class="px-4 py-2 bg-slate-100/80 border-b border-slate-200/70 flex items-center justify-between text-xs text-slate-500 flex-shrink-0">
        <span>共找到 <strong id="resultCount" class="text-slate-800">0</strong> 条记录</span>
        <span>按距起点由近到远排序</span>
      </div>

      <!-- 可滚动信息卡片列表 -->
      <div id="cardListContainer" class="flex-1 overflow-y-auto p-3.5 space-y-3">
        <!-- 卡片将通过 JS 动态渲染 -->
      </div>
    </aside>
  </div>

  <!-- ==================== 弹窗 1：7 维度多条件筛选 ==================== -->
  <div id="filterModal" class="hidden fixed inset-0 z-[1000] bg-slate-900/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[88vh] overflow-hidden">
      <!-- 弹窗头部 -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-900">多维度条件筛选</h2>
          <p class="text-xs text-slate-400 mt-0.5">支持 7 个维度组合精确检索</p>
        </div>
        <button id="btnCloseFilter" type="button" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">✕</button>
      </div>

      <!-- 筛选选项内容区 -->
      <div id="filterModalBody" class="p-5 overflow-y-auto space-y-5 flex-1">
        <!-- 由 JS 渲染 7 个维度的 Chip 按钮 -->
      </div>

      <!-- 弹窗底部按钮 -->
      <div class="px-5 py-3.5 border-t border-slate-100 bg-slate-50/70 flex items-center gap-3">
        <button id="btnResetFilter" type="button"
          class="flex-1 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
          重置条件
        </button>
        <button id="btnApplyFilter" type="button"
          class="flex-1 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold shadow-sm transition">
          确认筛选
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 弹窗 2：手动粘贴录入 + 智能识别 + 地图选点 ==================== -->
  <div id="inputModal" class="hidden fixed inset-0 z-[1000] bg-slate-900/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-2xl rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[92vh] overflow-hidden">
      <!-- 弹窗头部 -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-900">手动粘贴 / 录入信息</h2>
          <p class="text-xs text-slate-400 mt-0.5">粘贴纯文本一键提取字段，点击下方小地图精准落点</p>
        </div>
        <button id="btnCloseInput" type="button" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition">✕</button>
      </div>

      <!-- 表单主体 -->
      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <!-- 1. 粘贴原文智能识别区 -->
        <div class="bg-brand-50/60 border border-brand-100 rounded-xl p-3.5">
          <div class="flex items-center justify-between mb-2">
            <label for="formRawText" class="text-xs font-semibold text-brand-700">粘贴完整文字信息（支持一键正则识别）</label>
            <button id="btnParseText" type="button"
              class="px-3 py-1 rounded-lg bg-brand-500 hover:bg-brand-600 text-white text-xs font-medium shadow-sm transition active:scale-95">
              ✨ 自动识别下方字段
            </button>
          </div>
          <textarea id="formRawText" rows="3"
            placeholder="例如：周末白天，初二数学，280元/小时，要求女老师，国际双语学校，徐汇区虹桥路附近，需要梳理几何证明题..."
            class="w-full bg-white border border-slate-200 focus:border-brand-500 rounded-lg p-2.5 text-sm text-slate-700 placeholder-slate-400 outline-none resize-none transition"></textarea>
        </div>

        <!-- 2. 基础信息行 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label for="formTitle" class="block text-xs font-medium text-slate-600 mb-1">信息标题 <span class="text-red-500">*</span></label>
            <input id="formTitle" type="text" placeholder="如：徐汇初二数学双语辅导"
              class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-3 py-2 text-sm outline-none transition" />
          </div>
          <div>
            <label for="formFee" class="block text-xs font-medium text-slate-600 mb-1">费用（元/小时）</label>
            <input id="formFee" type="number" min="0" placeholder="如：260"
              class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-3 py-2 text-sm outline-none transition" />
          </div>
        </div>

        <!-- 3. 学科、年级、时间、性别 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label for="formSubject" class="block text-xs font-medium text-slate-600 mb-1">学科科目</label>
            <select id="formSubject" class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-2.5 py-2 text-sm outline-none"></select>
          </div>
          <div>
            <label for="formGrade" class="block text-xs font-medium text-slate-600 mb-1">年级段</label>
            <select id="formGrade" class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-2.5 py-2 text-sm outline-none"></select>
          </div>
          <div>
            <label for="formTimeSlot" class="block text-xs font-medium text-slate-600 mb-1">时间段</label>
            <select id="formTimeSlot" class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-2.5 py-2 text-sm outline-none"></select>
          </div>
          <div>
            <label for="formGender" class="block text-xs font-medium text-slate-600 mb-1">性别要求</label>
            <select id="formGender" class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-2.5 py-2 text-sm outline-none">
              <option value="不限">不限</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
        </div>

        <!-- 4. 双语 & 国际开关 -->
        <div class="flex flex-wrap items-center gap-6 bg-slate-50 border border-slate-200/80 rounded-xl px-4 py-2.5">
          <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-700 font-medium">
            <input id="formBilingual" type="checkbox" class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 border-slate-300" />
            <span>双语教学要求</span>
          </label>
          <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-slate-700 font-medium">
            <input id="formInternational" type="checkbox" class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 border-slate-300" />
            <span>国际课程 / 国际学校</span>
          </label>
        </div>

        <!-- 5. 地点名称与内置小型 Leaflet 选点地图 -->
        <div class="space-y-2">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <label for="formAddress" class="text-xs font-medium text-slate-600">
              目标地点名称与坐标 <span class="text-red-500">*</span>
            </label>
            <span id="formCoordStatus" class="text-xs text-slate-400">点击下方地图选取精准坐标</span>
          </div>
          <input id="formAddress" type="text" placeholder="输入地址名称（如：上海市徐汇区虹桥路）"
            class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-lg px-3 py-2 text-sm outline-none transition" />

          <!-- 小型选点地图容器 -->
          <div class="relative w-full h-48 sm:h-56 rounded-xl overflow-hidden border border-slate-200">
            <div id="pickerMap" class="w-full h-full"></div>
            <div class="absolute bottom-2 left-2 z-[400] bg-white/90 backdrop-blur px-2.5 py-1 rounded-lg shadow text-[11px] text-slate-600 pointer-events-none">
              点击地图任意处即可设置目标坐标
            </div>
          </div>
        </div>
      </div>

      <!-- 弹窗底部 -->
      <div class="px-5 py-3.5 border-t border-slate-100 bg-slate-50/70 flex items-center gap-3">
        <button id="btnCancelInput" type="button"
          class="flex-1 py-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-sm font-medium transition">
          取消
        </button>
        <button id="btnSaveRecord" type="button"
          class="flex-1 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold shadow-sm transition">
          保存并展示
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 弹窗 3：删除确认弹窗（替代 window.confirm） ==================== -->
  <div id="deleteModal" class="hidden fixed inset-0 z-[1100] bg-slate-900/50 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5">
      <h3 class="text-base font-bold text-slate-900">确认删除该条记录？</h3>
      <p id="deleteModalDesc" class="text-sm text-slate-500 mt-2">删除后将从本地缓存中移除，无法恢复。</p>
      <div class="mt-5 flex items-center gap-3">
        <button id="btnCancelDelete" type="button"
          class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium transition">
          取消
        </button>
        <button id="btnConfirmDelete" type="button"
          class="flex-1 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition">
          确认删除
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 全局轻量级 Toast 提示 ==================== -->
  <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-[1200] pointer-events-none opacity-0 -translate-y-2 transition-all duration-300">
    <div id="toastInner" class="bg-slate-900/90 text-white px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 whitespace-nowrap">
      <span id="toastText"></span>
    </div>
  </div>

  <!-- Leaflet JS (国内 BootCDN 源) -->
  <script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. 常量配置与初始示例数据
      // =========================================================================
      const STORAGE_KEY = 'WEB_INFO_RETRIEVAL_RECORDS_V1';
      const DEFAULT_ORIGIN = { lat: 31.2304, lng: 121.4737, label: '上海人民广场' };

      const FILTER_OPTIONS = {
        subjects: ['全部', '语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '全科'],
        grades: ['全部', '学前', '小学', '初中', '高中', '大学/成人'],
        timeSlots: ['全部', '工作日白天', '工作日晚上', '周末白天', '周末晚上', '时间灵活'],
        feeRanges: [
          { label: '不限', min: 0, max: Infinity },
          { label: '150以下', min: 0, max: 149 },
          { label: '150-300', min: 150, max: 300 },
          { label: '300以上', min: 301, max: Infinity }
        ],
        genders: ['不限', '男', '女'],
        boolOptions: ['不限', '是', '否']
      };

      const DEFAULT_RECORDS = [
        {
          id: 1001,
          title: '徐汇初二数学双语辅导',
          content: '周末白天上课，学生就读民办双语学校，需要系统梳理几何证明题与压轴题思路，要求女老师有耐心。',
          address: '上海市徐汇区虹桥路',
          lat: 31.1950,
          lng: 121.4368,
          subject: '数学',
          grade: '初中',
          timeSlot: '周末白天',
          fee: 260,
          gender: '女',
          isBilingual: true,
          isInternational: false
        },
        {
          id: 1002,
          title: '浦东国际高中 IB 物理辅导',
          content: '工作日晚上线下授课，国际学校 11 年级，全英文教材（IB HL Physics），男女不限，有国际课程经验优先。',
          address: '上海市浦东新区碧云国际社区',
          lat: 31.2392,
          lng: 121.5880,
          subject: '物理',
          grade: '高中',
          timeSlot: '工作日晚上',
          fee: 450,
          gender: '不限',
          isBilingual: true,
          isInternational: true
        },
        {
          id: 1003,
          title: '苏州工业园区跨城竞赛集训',
          content: '跨城周末集中辅导项目（近苏州园区高铁站），高中物理/数学竞赛冲刺集训，交通补贴另计。',
          address: '江苏省苏州市工业园区现代大道',
          lat: 31.3190,
          lng: 120.7200,
          subject: '数学',
          grade: '高中',
          timeSlot: '周末白天',
          fee: 500,
          gender: '不限',
          isBilingual: false,
          isInternational: true
        }
      ];

      // =========================================================================
      // 2. 应用状态与地图实例引用
      // =========================================================================
      const state = {
        origin: { ...DEFAULT_ORIGIN },
        records: [],
        filteredRecords: [],
        searchKeyword: '',
        filters: {
          subject: '全部',
          grade: '全部',
          timeSlot: '全部',
          feeIndex: 0,
          gender: '不限',
          bilingual: '不限',
          international: '不限'
        },
        draftFilters: {},
        selectedId: null,
        isPickingOrigin: false,
        pickerCoord: { lat: null, lng: null },
        pendingDeleteId: null
      };

      let mainMap = null;
      let markersLayer = null;
      const markerMap = new Map();
      let originMarker = null;
      let routePolyline = null;
      let pickerMap = null;
      let pickerMarker = null;
      let toastTimer = null;

      // =========================================================================
      // 3. 本地数据持久化（localStorage）
      // =========================================================================
      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              state.records = parsed;
              return;
            }
          }
        } catch (err) {
          console.warn('读取本地缓存失败，已回退至示例数据:', err);
        }
        state.records = DEFAULT_RECORDS.map((item) => ({ ...item }));
      }

      function saveRecords() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
        } catch (err) {
          console.warn('保存本地缓存失败:', err);
          showToast('本地存储空间不足或被浏览器禁用');
        }
      }

      // =========================================================================
      // 4. 通用工具函数（防 XSS 转义、Toast 提示、Haversine 距离、交通时长估算）
      // =========================================================================
      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        const box = document.getElementById('toastBox');
        const textEl = document.getElementById('toastText');
        if (!box || !textEl) return;

        textEl.textContent = message;
        box.classList.remove('opacity-0', '-translate-y-2');
        box.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          box.classList.remove('opacity-100', 'translate-y-0');
          box.classList.add('opacity-0', '-translate-y-2');
        }, 2600);
      }

      function calculateHaversineKm(lat1, lng1, lat2, lng2) {
        const toRad = (deg) => (deg * Math.PI) / 180;
        const R = 6371;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function estimateTransportDurations(km) {
        const formatTime = (hours) => {
          const totalMinutes = Math.round(hours * 60);
          if (totalMinutes < 1) return '1分';
          if (totalMinutes < 60) return `${totalMinutes}分`;
          const h = Math.floor(totalMinutes / 60);
          const m = totalMinutes % 60;
          return m > 0 ? `${h}时${m}分` : `${h}小时`;
        };

        return {
          walk: km > 50 ? '过远' : formatTime(km / 4.5),
          bike: km > 100 ? '过远' : formatTime(km / 14),
          ebike: km > 80 ? '超续航' : formatTime(km / 25),
          car: formatTime(km / (km > 30 ? 65 : 30)),
          hsr: km < 30 ? '不适用' : formatTime(km / 250 + 0.65)
        };
      }

      // =========================================================================
      // 5. 初始化主地图（Leaflet + 高德地图中文标准导航底图）
      // =========================================================================
      function initMainMap() {
        mainMap = L.map('mainMap', {
          center: [state.origin.lat, state.origin.lng],
          zoom: 11,
          zoomControl: true
        });

        // 使用高德地图标准中文导航瓦片底图（国内直连，带彩色路网、小区与地铁站）
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
          attribution: '&copy; 高德地图',
          subdomains: ['1', '2', '3', '4'],
          maxZoom: 18
        }).addTo(mainMap);

        markersLayer = L.layerGroup().addTo(mainMap);
        renderOriginMarker();

        // 监听地图点击事件（用于“点图重设起点”模式）
        mainMap.on('click', (e) => {
          if (!state.isPickingOrigin) return;
          const { lat, lng } = e.latlng;
          setOrigin(lat, lng, `自定义 (${lat.toFixed(3)}, ${lng.toFixed(3)})`);
          togglePickOriginMode(false);
          showToast('已更新地图起点，距离与时长已重新计算');
        });

        window.addEventListener('resize', () => {
          if (mainMap) mainMap.invalidateSize();
        });
      }

      function renderOriginMarker() {
        if (originMarker) {
          mainMap.removeLayer(originMarker);
        }
        const icon = L.divIcon({
          className: '',
          html: '<div class="origin-pulse-wrapper"><div class="origin-pulse-ring"></div><div class="origin-dot"></div></div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        originMarker = L.marker([state.origin.lat, state.origin.lng], {
          icon,
          zIndexOffset: 900
        })
          .bindTooltip(`当前起点：${escapeHtml(state.origin.label)}`, { direction: 'top', offset: [0, -10] })
          .addTo(mainMap);

        const labelEl = document.getElementById('originLabel');
        if (labelEl) labelEl.textContent = state.origin.label;
      }

      function setOrigin(lat, lng, label) {
        state.origin = { lat, lng, label };
        renderOriginMarker();
        processAndRender();

        // 若已有选中项，自动重新绘制路线折线
        if (state.selectedId) {
          const target = state.filteredRecords.find((r) => r.id === state.selectedId);
          if (target) {
            drawRouteToItem(target, false);
          } else {
            clearRoutePolyline();
          }
        } else {
          mainMap.setView([lat, lng], 11);
        }
      }

      function togglePickOriginMode(active) {
        state.isPickingOrigin = active;
        const mapEl = document.getElementById('mainMap');
        const banner = document.getElementById('pickOriginBanner');
        const btn = document.getElementById('btnPickOrigin');
        const btnText = document.getElementById('btnPickOriginText');

        if (active) {
          mapEl.classList.add('cursor-crosshair-map');
          banner.classList.remove('hidden');
          btn.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-50');
          btnText.textContent = '取消选点';
        } else {
          mapEl.classList.remove('cursor-crosshair-map');
          banner.classList.add('hidden');
          btn.classList.remove('ring-2', 'ring-emerald-500', 'bg-emerald-50');
          btnText.textContent = '点图设起点';
        }
      }

      // =========================================================================
      // 6. 核心业务：计算距离、过滤排序、渲染列表与地图标记
      // =========================================================================
      function processAndRender() {
        const kw = state.searchKeyword.trim().toLowerCase();
        const f = state.filters;
        const feeRule = FILTER_OPTIONS.feeRanges[f.feeIndex];

        // 1. 计算距离与 5 种交通时长
        const enriched = state.records.map((item) => {
          const straightKm = calculateHaversineKm(state.origin.lat, state.origin.lng, item.lat, item.lng);
          const roadKm = straightKm * 1.25;
          return {
            ...item,
            distanceKm: roadKm,
            distanceText: roadKm < 1 ? `${Math.round(roadKm * 1000)}m` : `${roadKm.toFixed(1)}km`,
            durations: estimateTransportDurations(roadKm)
          };
        });

        // 2. 执行关键词 + 7 维度筛选
        const filtered = enriched.filter((item) => {
          const matchKw =
            !kw ||
            item.title.toLowerCase().includes(kw) ||
            item.content.toLowerCase().includes(kw) ||
            item.address.toLowerCase().includes(kw) ||
            item.subject.toLowerCase().includes(kw);

          const matchSubject = f.subject === '全部' || item.subject === f.subject;
          const matchGrade = f.grade === '全部' || item.grade === f.grade;
          const matchTime = f.timeSlot === '全部' || item.timeSlot === f.timeSlot;
          const matchFee = item.fee >= feeRule.min && item.fee <= feeRule.max;
          const matchGender = f.gender === '不限' || item.gender === f.gender || item.gender === '不限';
          const matchBilingual =
            f.bilingual === '不限' || (f.bilingual === '是' ? item.isBilingual : !item.isBilingual);
          const matchInternational =
            f.international === '不限' || (f.international === '是' ? item.isInternational : !item.isInternational);

          return (
            matchKw &&
            matchSubject &&
            matchGrade &&
            matchTime &&
            matchFee &&
            matchGender &&
            matchBilingual &&
            matchInternational
          );
        });

        // 3. 按距离由近到远排序
        filtered.sort((a, b) => a.distanceKm - b.distanceKm);
        state.filteredRecords = filtered;

        // 若当前选中项已被过滤掉，则清除路线
        if (state.selectedId && !filtered.some((i) => i.id === state.selectedId)) {
          state.selectedId = null;
          clearRoutePolyline();
        }

        renderFilterBadgeAndSummary();
        renderCardList();
        renderMapMarkers();
      }

      function renderFilterBadgeAndSummary() {
        const f = state.filters;
        const activeTags = [];
        if (f.subject !== '全部') activeTags.push({ label: f.subject, key: 'subject', reset: '全部' });
        if (f.grade !== '全部') activeTags.push({ label: f.grade, key: 'grade', reset: '全部' });
        if (f.timeSlot !== '全部') activeTags.push({ label: f.timeSlot, key: 'timeSlot', reset: '全部' });
        if (f.feeIndex !== 0) activeTags.push({ label: `¥${FILTER_OPTIONS.feeRanges[f.feeIndex].label}`, key: 'feeIndex', reset: 0 });
        if (f.gender !== '不限') activeTags.push({ label: `性别:${f.gender}`, key: 'gender', reset: '不限' });
        if (f.bilingual !== '不限') activeTags.push({ label: f.bilingual === '是' ? '双语' : '非双语', key: 'bilingual', reset: '不限' });
        if (f.international !== '不限') activeTags.push({ label: f.international === '是' ? '国际' : '非国际', key: 'international', reset: '不限' });

        const badge = document.getElementById('filterCountBadge');
        const summary = document.getElementById('activeFilterSummary');
        const filterBtn = document.getElementById('btnOpenFilter');

        if (activeTags.length > 0) {
          badge.textContent = activeTags.length;
          badge.classList.remove('hidden');
          filterBtn.classList.add('border-brand-500', 'bg-brand-50/60', 'text-brand-600');

          summary.classList.remove('hidden');
          summary.innerHTML =
            activeTags
              .map(
                (t) => `
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-brand-50 text-brand-600 text-[11px] font-medium">
                ${escapeHtml(t.label)}
                <button type="button" data-quick-reset="${t.key}" data-reset-val="${t.reset}" class="hover:text-brand-700 font-bold ml-0.5">✕</button>
              </span>`
              )
              .join('') +
            `<button type="button" id="btnQuickClearFilters" class="text-[11px] text-slate-400 hover:text-slate-600 underline ml-1">清空</button>`;

          summary.querySelectorAll('[data-quick-reset]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const key = btn.getAttribute('data-quick-reset');
              const val = btn.getAttribute('data-reset-val');
              state.filters[key] = key === 'feeIndex' ? Number(val) : val;
              processAndRender();
            });
          });
          const clearBtn = document.getElementById('btnQuickClearFilters');
          if (clearBtn) {
            clearBtn.addEventListener('click', () => {
              resetAllFilters();
              processAndRender();
            });
          }
        } else {
          badge.classList.add('hidden');
          filterBtn.classList.remove('border-brand-500', 'bg-brand-50/60', 'text-brand-600');
          summary.classList.add('hidden');
          summary.innerHTML = '';
        }
      }

      function renderCardList() {
        const container = document.getElementById('cardListContainer');
        document.getElementById('resultCount').textContent = state.filteredRecords.length;

        if (state.filteredRecords.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-14 px-6 text-center">
              <div class="w-12 h-12 rounded-2xl bg-slate-200/70 text-slate-400 flex items-center justify-center mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <p class="text-sm font-medium text-slate-600">未找到符合条件的信息</p>
              <p class="text-xs text-slate-400 mt-1">可尝试清空关键词、调整多维筛选，或点击右上角“录入信息”</p>
            </div>
          `;
          return;
        }

        container.innerHTML = state.filteredRecords
          .map((item) => {
            const isSelected = state.selectedId === item.id;
            return `
              <article data-card-id="${item.id}"
                class="group bg-white rounded-2xl p-4 border-2 transition cursor-pointer shadow-sm hover:shadow-md ${
                  isSelected ? 'border-brand-500 ring-2 ring-brand-500/15' : 'border-transparent hover:border-slate-200'
                }">
                <!-- 标题与费用 -->
                <div class="flex items-start justify-between gap-2 mb-2">
                  <h3 class="text-[15px] font-bold text-slate-900 leading-snug flex-1">${escapeHtml(item.title)}</h3>
                  <div class="flex items-center gap-2 flex-shrink-0">
                    <span class="text-[15px] font-bold text-rose-500">¥${item.fee}<span class="text-xs font-normal text-rose-400">/时</span></span>
                    <button type="button" data-delete-id="${item.id}" title="删除此记录"
                      class="w-6 h-6 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 flex items-center justify-center transition">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                      </svg>
                    </button>
                  </div>
                </div>

                <!-- 7 维属性标签 -->
                <div class="flex flex-wrap gap-1.5 mb-2.5">
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-brand-50 text-brand-600">${escapeHtml(item.subject)}</span>
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-brand-50 text-brand-600">${escapeHtml(item.grade)}</span>
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-600">${escapeHtml(item.timeSlot)}</span>
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-600">要求：${escapeHtml(item.gender)}</span>
                  ${item.isBilingual ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-amber-50 text-amber-600">双语</span>' : ''}
                  ${item.isInternational ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-purple-50 text-purple-600">国际</span>' : ''}
                </div>

                <!-- 正文描述 -->
                <p class="text-xs text-slate-600 leading-relaxed mb-3 line-clamp-3">${escapeHtml(item.content)}</p>

                <!-- 地址与距起点距离 -->
                <div class="flex items-center justify-between gap-2 text-xs pb-2.5 mb-2.5 border-b border-dashed border-slate-200">
                  <span class="text-slate-400 truncate flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 flex-shrink-0 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/>
                    </svg>
                    <span class="truncate">${escapeHtml(item.address)}</span>
                  </span>
                  <span class="text-amber-600 font-semibold whitespace-nowrap flex-shrink-0">距起点约 ${item.distanceText}</span>
                </div>

                <!-- 5 种交通方式时长网格 -->
                <div class="grid grid-cols-5 gap-1 bg-slate-50 rounded-xl p-2 text-center">
                  <div class="flex flex-col">
                    <span class="text-[11px] text-slate-400">步行</span>
                    <span class="text-xs font-semibold text-slate-700 mt-0.5">${item.durations.walk}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[11px] text-slate-400">自行车</span>
                    <span class="text-xs font-semibold text-slate-700 mt-0.5">${item.durations.bike}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[11px] text-slate-400">电动车</span>
                    <span class="text-xs font-semibold text-slate-700 mt-0.5">${item.durations.ebike}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[11px] text-slate-400">汽车</span>
                    <span class="text-xs font-semibold text-brand-600 mt-0.5">${item.durations.car}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[11px] text-slate-400">高铁</span>
                    <span class="text-xs font-semibold ${item.durations.hsr === '不适用' ? 'text-slate-400 font-normal' : 'text-emerald-600'} mt-0.5">${item.durations.hsr}</span>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        // 绑定卡片点击（绘制路线）和删除按钮点击
        container.querySelectorAll('[data-card-id]').forEach((card) => {
          card.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('[data-delete-id]');
            if (deleteBtn) {
              e.stopPropagation();
              const delId = Number(deleteBtn.getAttribute('data-delete-id'));
              openDeleteModal(delId);
              return;
            }
            const id = Number(card.getAttribute('data-card-id'));
            selectItem(id, false);
          });
        });
      }

      function renderMapMarkers() {
        markersLayer.clearLayers();
        markerMap.clear();

        state.filteredRecords.forEach((item) => {
          const isSelected = state.selectedId === item.id;
          const icon = L.divIcon({
            className: '',
            html: `<div class="custom-marker-pill ${isSelected ? 'active' : ''}">
              <span>${escapeHtml(item.subject)} ¥${item.fee}</span>
              <span style="opacity:0.45">|</span>
              <span>约${item.distanceText}</span>
            </div>`,
            iconSize: null
          });

          const marker = L.marker([item.lat, item.lng], {
            icon,
            zIndexOffset: isSelected ? 800 : 100
          });

          marker.on('click', () => {
            selectItem(item.id, true);
          });

          marker.addTo(markersLayer);
          markerMap.set(item.id, marker);
        });
      }

      /**
       * 选中某条记录：高亮卡片与标记、绘制动态路线折线、缩放地图视野
       */
      function selectItem(id, scrollCardIntoView) {
        const target = state.filteredRecords.find((item) => item.id === id);
        if (!target) return;

        state.selectedId = id;
        renderCardList();
        renderMapMarkers();
        drawRouteToItem(target, true);

        if (scrollCardIntoView) {
          const cardEl = document.querySelector(`[data-card-id="${id}"]`);
          if (cardEl) {
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }

      function clearRoutePolyline() {
        if (routePolyline) {
          mainMap.removeLayer(routePolyline);
          routePolyline = null;
        }
      }

      function drawRouteToItem(target, shouldFitBounds) {
        clearRoutePolyline();

        const latlngs = [
          [state.origin.lat, state.origin.lng],
          [target.lat, target.lng]
        ];

        routePolyline = L.polyline(latlngs, {
          color: '#1677ff',
          weight: 4,
          opacity: 0.9,
          className: 'route-polyline-animated'
        }).addTo(mainMap);

        if (shouldFitBounds) {
          mainMap.fitBounds(routePolyline.getBounds(), {
            padding: [65, 65],
            maxZoom: 14,
            animate: true
          });
        }
      }

      // =========================================================================
      // 7. 7 维度多条件筛选弹窗逻辑
      // =========================================================================
      function resetAllFilters() {
        state.filters = {
          subject: '全部',
          grade: '全部',
          timeSlot: '全部',
          feeIndex: 0,
          gender: '不限',
          bilingual: '不限',
          international: '不限'
        };
      }

      function openFilterModal() {
        state.draftFilters = { ...state.filters };
        renderFilterModalBody();
        document.getElementById('filterModal').classList.remove('hidden');
      }

      function closeFilterModal() {
        document.getElementById('filterModal').classList.add('hidden');
      }

      function renderFilterModalBody() {
        const d = state.draftFilters;
        const body = document.getElementById('filterModalBody');

        const buildSection = (title, field, items, isIndexMode = false) => {
          return `
            <div>
              <h3 class="text-xs font-bold text-slate-700 mb-2.5">${title}</h3>
              <div class="flex flex-wrap gap-2">
                ${items
                  .map((item, idx) => {
                    const label = isIndexMode ? item.label : item;
                    const val = isIndexMode ? idx : item;
                    const active = d[field] === val;
                    return `
                      <button type="button" data-filter-field="${field}" data-filter-val="${val}" data-index-mode="${isIndexMode}"
                        class="px-3 py-1.5 rounded-xl text-xs font-medium transition ${
                          active
                            ? 'bg-brand-500 text-white shadow-sm'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }">
                        ${escapeHtml(label)}
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          `;
        };

        body.innerHTML = [
          buildSection('1. 学科科目', 'subject', FILTER_OPTIONS.subjects),
          buildSection('2. 年级段', 'grade', FILTER_OPTIONS.grades),
          buildSection('3. 时间段', 'timeSlot', FILTER_OPTIONS.timeSlots),
          buildSection('4. 费用区间（元/小时）', 'feeIndex', FILTER_OPTIONS.feeRanges, true),
          buildSection('5. 男女性别要求', 'gender', FILTER_OPTIONS.genders),
          buildSection('6. 是否双语', 'bilingual', FILTER_OPTIONS.boolOptions),
          buildSection('7. 是否国际课程 / 学校', 'international', FILTER_OPTIONS.boolOptions)
        ].join('');

        body.querySelectorAll('[data-filter-field]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const field = btn.getAttribute('data-filter-field');
            const isIndex = btn.getAttribute('data-index-mode') === 'true';
            const rawVal = btn.getAttribute('data-filter-val');
            state.draftFilters[field] = isIndex ? Number(rawVal) : rawVal;
            renderFilterModalBody();
          });
        });
      }

      // =========================================================================
      // 8. 手动粘贴录入 + 正则智能提取 + 内置 Leaflet 选点地图
      // =========================================================================
      function populateFormSelects() {
        const fill = (id, list) => {
          const el = document.getElementById(id);
          el.innerHTML = list.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
        };
        fill('formSubject', FILTER_OPTIONS.subjects.filter((s) => s !== '全部'));
        fill('formGrade', FILTER_OPTIONS.grades.filter((g) => g !== '全部'));
        fill('formTimeSlot', FILTER_OPTIONS.timeSlots.filter((t) => t !== '全部'));
      }

      function openInputModal() {
        document.getElementById('inputModal').classList.remove('hidden');

        // 延迟初始化或刷新小型选点地图，避免在隐藏容器中尺寸异常
        setTimeout(() => {
          if (!pickerMap) {
            pickerMap = L.map('pickerMap', {
              center: [state.origin.lat, state.origin.lng],
              zoom: 12
            });
            L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
              attribution: '&copy; 高德地图',
              subdomains: ['1', '2', '3', '4'],
              maxZoom: 18
            }).addTo(pickerMap);

            pickerMap.on('click', (e) => {
              setPickerCoord(e.latlng.lat, e.latlng.lng);
            });
          } else {
            pickerMap.invalidateSize();
          }

          if (!state.pickerCoord.lat) {
            pickerMap.setView([state.origin.lat, state.origin.lng], 12);
          }
        }, 120);
      }

      function closeInputModal() {
        document.getElementById('inputModal').classList.add('hidden');
      }

      function setPickerCoord(lat, lng) {
        state.pickerCoord = { lat, lng };
        if (pickerMarker) {
          pickerMarker.setLatLng([lat, lng]);
        } else {
          pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
        }
        const statusEl = document.getElementById('formCoordStatus');
        statusEl.textContent = `已选坐标：${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        statusEl.classList.remove('text-slate-400');
        statusEl.classList.add('text-emerald-600', 'font-medium');
      }

      /**
       * 从粘贴的纯文本中自动提取 7 大维度字段并回填表单
       */
      function parsePastedText() {
        const text = document.getElementById('formRawText').value.trim();
        if (!text) {
          showToast('请先在上方粘贴文字内容');
          return;
        }

        // 1. 提取费用（如 260元、300/小时、200块）
        const feeMatch = text.match(/(\d{2,4})\s*(元|块|\/时|\/小时|每小时)/);
        if (feeMatch) {
          document.getElementById('formFee').value = feeMatch[1];
        }

        // 2. 提取学科科目
        const validSubjects = FILTER_OPTIONS.subjects.filter((s) => s !== '全部');
        const matchedSubject = validSubjects.find((s) => text.includes(s));
        if (matchedSubject) {
          document.getElementById('formSubject').value = matchedSubject;
        }

        // 3. 提取年级段
        let matchedGrade = null;
        if (/学前|幼儿园/.test(text)) matchedGrade = '学前';
        else if (/小学|[一二三四五六]年级/.test(text)) matchedGrade = '小学';
        else if (/初中|初[一二三]|[七八九]年级/.test(text)) matchedGrade = '初中';
        else if (/高中|高[一二三]|1[012]年级/.test(text)) matchedGrade = '高中';
        else if (/大学|成人|考研/.test(text)) matchedGrade = '大学/成人';
        if (matchedGrade) {
          document.getElementById('formGrade').value = matchedGrade;
        }

        // 4. 提取时间段
        if (/周末|周六|周日/.test(text)) {
          document.getElementById('formTimeSlot').value = /晚/.test(text) ? '周末晚上' : '周末白天';
        } else if (/工作日|周[一二三四五]/.test(text)) {
          document.getElementById('formTimeSlot').value = /晚/.test(text) ? '工作日晚上' : '工作日白天';
        } else if (/灵活|协商|均可/.test(text)) {
          document.getElementById('formTimeSlot').value = '时间灵活';
        }

        // 5. 提取性别要求
        if (/仅限女|女老师|限女|要求女/.test(text)) {
          document.getElementById('formGender').value = '女';
        } else if (/仅限男|男老师|限男|要求男/.test(text)) {
          document.getElementById('formGender').value = '男';
        } else {
          document.getElementById('formGender').value = '不限';
        }

        // 6. 提取双语与国际标识
        document.getElementById('formBilingual').checked = /双语|全英|英文授课/i.test(text);
        document.getElementById('formInternational').checked = /国际|IB|AP|A-Level|IGCSE/i.test(text);

        // 7. 尝试提取简短地址片段（如 XX区XX路）
        const addrInput = document.getElementById('formAddress');
        if (!addrInput.value.trim()) {
          const addrMatch = text.match(/([\u4e00-\u9fa5]{2,8}(?:区|县|市)[\u4e00-\u9fa50-9]{0,12}(?:路|街|道|大道|社区|小区|广场|附近)?)/);
          if (addrMatch) {
            addrInput.value = addrMatch[1];
          }
        }

        // 8. 自动生成默认标题
        const titleInput = document.getElementById('formTitle');
        if (!titleInput.value.trim()) {
          const g = document.getElementById('formGrade').value;
          const s = document.getElementById('formSubject').value;
          const isIntl = document.getElementById('formInternational').checked ? '国际' : '';
          const isBi = document.getElementById('formBilingual').checked ? '双语' : '';
          titleInput.value = `${g}${s}${isIntl}${isBi}信息`;
        }

        showToast('字段已自动识别，请核对并在小地图点选位置');
      }

      function saveNewRecord() {
        const title = document.getElementById('formTitle').value.trim();
        const rawText = document.getElementById('formRawText').value.trim();
        const fee = Number(document.getElementById('formFee').value) || 0;
        const subject = document.getElementById('formSubject').value;
        const grade = document.getElementById('formGrade').value;
        const timeSlot = document.getElementById('formTimeSlot').value;
        const gender = document.getElementById('formGender').value;
        const isBilingual = document.getElementById('formBilingual').checked;
        const isInternational = document.getElementById('formInternational').checked;
        const address = document.getElementById('formAddress').value.trim();

        if (!title) {
          showToast('请填写信息标题');
          document.getElementById('formTitle').focus();
          return;
        }
        if (state.pickerCoord.lat === null || state.pickerCoord.lng === null) {
          showToast('请在下方小地图上点击选取目标坐标');
          return;
        }

        const newRecord = {
          id: Date.now(),
          title,
          content: rawText || `${grade}${subject}，${timeSlot}，性别要求：${gender}`,
          address: address || `地图选点 (${state.pickerCoord.lat.toFixed(4)}, ${state.pickerCoord.lng.toFixed(4)})`,
          lat: state.pickerCoord.lat,
          lng: state.pickerCoord.lng,
          fee,
          subject,
          grade,
          timeSlot,
          gender,
          isBilingual,
          isInternational
        };

        state.records.unshift(newRecord);
        saveRecords();

        // 重置表单状态
        document.getElementById('formRawText').value = '';
        document.getElementById('formTitle').value = '';
        document.getElementById('formFee').value = '';
        document.getElementById('formAddress').value = '';
        document.getElementById('formBilingual').checked = false;
        document.getElementById('formInternational').checked = false;
        state.pickerCoord = { lat: null, lng: null };
        if (pickerMarker && pickerMap) {
          pickerMap.removeLayer(pickerMarker);
          pickerMarker = null;
        }
        const statusEl = document.getElementById('formCoordStatus');
        statusEl.textContent = '点击下方地图选取精准坐标';
        statusEl.classList.add('text-slate-400');
        statusEl.classList.remove('text-emerald-600', 'font-medium');

        closeInputModal();
        processAndRender();
        selectItem(newRecord.id, true);
        showToast('新信息已录入并绘制路线');
      }

      // =========================================================================
      // 9. 删除记录弹窗逻辑
      // =========================================================================
      function openDeleteModal(id) {
        const target = state.records.find((r) => r.id === id);
        if (!target) return;
        state.pendingDeleteId = id;
        document.getElementById('deleteModalDesc').textContent = `确定要删除“${target.title}”吗？删除后无法恢复。`;
        document.getElementById('deleteModal').classList.remove('hidden');
      }

      function closeDeleteModal() {
        state.pendingDeleteId = null;
        document.getElementById('deleteModal').classList.add('hidden');
      }

      function confirmDeleteRecord() {
        if (!state.pendingDeleteId) return;
        state.records = state.records.filter((r) => r.id !== state.pendingDeleteId);
        if (state.selectedId === state.pendingDeleteId) {
          state.selectedId = null;
          clearRoutePolyline();
        }
        saveRecords();
        closeDeleteModal();
        processAndRender();
        showToast('记录已删除');
      }

      // =========================================================================
      // 10. 浏览器定位与事件绑定
      // =========================================================================
      function requestBrowserLocation() {
        if (!navigator.geolocation) {
          showToast('当前浏览器不支持地理定位，请使用“点图设起点”');
          return;
        }
        showToast('正在获取当前定位...');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            setOrigin(latitude, longitude, '我的当前位置');
            showToast('已更新为当前真实位置');
          },
          () => {
            showToast('定位未授权或超时，您可点击“点图设起点”手动设置');
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }

      function bindEvents() {
        // 搜索框
        const searchInput = document.getElementById('searchInput');
        const btnClearSearch = document.getElementById('btnClearSearch');
        searchInput.addEventListener('input', (e) => {
          state.searchKeyword = e.target.value;
          btnClearSearch.classList.toggle('hidden', !state.searchKeyword);
          processAndRender();
        });
        btnClearSearch.addEventListener('click', () => {
          searchInput.value = '';
          state.searchKeyword = '';
          btnClearSearch.classList.add('hidden');
          processAndRender();
        });

        // 地图起点控制
        document.getElementById('btnLocateMe').addEventListener('click', requestBrowserLocation);
        document.getElementById('btnPickOrigin').addEventListener('click', () => {
          togglePickOriginMode(!state.isPickingOrigin);
        });
        document.getElementById('btnCancelPickOrigin').addEventListener('click', () => {
          togglePickOriginMode(false);
        });

        // 筛选弹窗
        document.getElementById('btnOpenFilter').addEventListener('click', openFilterModal);
        document.getElementById('btnCloseFilter').addEventListener('click', closeFilterModal);
        document.getElementById('filterModal').addEventListener('click', (e) => {
          if (e.target.id === 'filterModal') closeFilterModal();
        });
        document.getElementById('btnResetFilter').addEventListener('click', () => {
          state.draftFilters = {
            subject: '全部',
            grade: '全部',
            timeSlot: '全部',
            feeIndex: 0,
            gender: '不限',
            bilingual: '不限',
            international: '不限'
          };
          renderFilterModalBody();
        });
        document.getElementById('btnApplyFilter').addEventListener('click', () => {
          state.filters = { ...state.draftFilters };
          closeFilterModal();
          processAndRender();
        });

        // 录入弹窗
        document.getElementById('btnOpenInput').addEventListener('click', openInputModal);
        document.getElementById('btnCloseInput').addEventListener('click', closeInputModal);
        document.getElementById('btnCancelInput').addEventListener('click', closeInputModal);
        document.getElementById('inputModal').addEventListener('click', (e) => {
          if (e.target.id === 'inputModal') closeInputModal();
        });
        document.getElementById('btnParseText').addEventListener('click', parsePastedText);
        document.getElementById('btnSaveRecord').addEventListener('click', saveNewRecord);

        // 删除确认弹窗
        document.getElementById('btnCancelDelete').addEventListener('click', closeDeleteModal);
        document.getElementById('btnConfirmDelete').addEventListener('click', confirmDeleteRecord);
        document.getElementById('deleteModal').addEventListener('click', (e) => {
          if (e.target.id === 'deleteModal') closeDeleteModal();
        });
      }

      // =========================================================================
      // 11. 应用启动入口
      // =========================================================================
      window.addEventListener('DOMContentLoaded', () => {
        populateFormSelects();
        loadRecords();
        initMainMap();
        bindEvents();
        processAndRender();
      });
    })();
  </script>
</body>
</html>
